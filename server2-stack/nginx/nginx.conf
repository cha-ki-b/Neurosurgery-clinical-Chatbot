# Server 2 reverse proxy - core configuration.
#
# Per-service vhosts live in templates/*.template and are rendered into conf.d by the image's
# entrypoint. This file holds only what has to be in the http{} context: logging, shared limits,
# and the default server that refuses anything not addressed to a known hostname.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Logs which vhost and which upstream status, because with several services behind one proxy
    # "it returned 403" is useless without knowing which one and to whom.
    log_format server2 '$remote_addr - $host "$request" $status '
                       'upstream=$upstream_status rt=$request_time '
                       'ua="$http_user_agent"';
    access_log /var/log/nginx/access.log server2;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Rate limits must be declared in http{}. The agent zone is sized for a department: a chat
    # turn is a human typing, so anything faster than this is a loop or a probe, not a clinician.
    limit_req_zone $binary_remote_addr zone=agent_chat:10m rate=60r/m;
    limit_req_status 429;

    # --- default server: reject anything not addressed to a known hostname -------------------
    #
    # Without this, the first vhost defined would answer requests made to the bare IP address -
    # which would put the assistant on a URL that bypasses the whole point of naming it. 444
    # closes the connection with no response at all, so a scanner learns nothing.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        include /etc/nginx/snippets/tls.conf;

        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
