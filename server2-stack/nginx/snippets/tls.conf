# TLS settings shared by every vhost on this host.
#
# agent.crt is issued by the hospital's existing authority (hospitalCA on Server 1), the same one
# that signs openmrs.hospital.lan, orthanc.hospital.lan and viewer.hospital.lan - so any machine
# that already trusts the hospital CA trusts this host too, with nothing extra to install.
#
# Only the leaf certificate is served. hospitalCA is a root and the clients that matter already
# hold it; sending a root in the chain adds bytes and no trust.

ssl_certificate     /etc/nginx/certs/agent.crt;
ssl_certificate_key /etc/nginx/certs/agent.key;

# Matches the profile already validated on Server 1's proxy.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
