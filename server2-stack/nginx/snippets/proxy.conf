# Standard proxy headers.
#
# X-Real-IP / X-Forwarded-For matter more than usual here: the agent's own logs are the only place
# an administrator can see that a turn arrived from Server 1 rather than from somewhere unexpected,
# and without these every request would appear to come from the proxy container.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
